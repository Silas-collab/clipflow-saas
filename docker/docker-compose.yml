version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clipflow_db
    environment:
      POSTGRES_USER: clipflow
      POSTGRES_PASSWORD: clipflow123
      POSTGRES_DB: clipflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clipflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: ../../docker/api.Dockerfile
    container_name: clipflow_api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://clipflow:clipflow123@postgres:5432/clipflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: clipflow-secret-key-change-in-production
      NODE_ENV: production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: ../../docker/web.Dockerfile
    container_name: clipflow_web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
