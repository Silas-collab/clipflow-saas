version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clipflow_db
    environment:
      POSTGRES_USER: clipflow
      POSTGRES_PASSWORD: clipflow_secret
      POSTGRES_DB: clipflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clipflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: clipflow_api
    environment:
      DATABASE_URL: postgresql://clipflow:clipflow_secret@postgres:5432/clipflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: clipflow_jwt_secret_key_2024
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-placeholder}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: clipflow_web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
